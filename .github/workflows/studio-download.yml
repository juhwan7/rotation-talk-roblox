name: Studio download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-download
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install verified Luau 0.740
        run: |
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip -o "$RUNNER_TEMP/luau.zip"
          echo "7d4035db01816f977f6e4c42e3d5e8ef4235d95e9afe63a3c38905b42dde60f2  $RUNNER_TEMP/luau.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-compile"
      - name: Compile and test game rules
        run: node tools/test.mjs "$RUNNER_TEMP/luau/luau" "$RUNNER_TEMP/luau/luau-compile"
      - name: Build Studio place
        run: |
          node tools/build.mjs
          node tools/release-info.mjs
      - name: Publish downloadable development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; its build will publish the next download."
            exit 0
          fi
          tag="studio-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" build/RotationTalk.rbxlx build/BUILD-INFO.txt build/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Studio 개발 빌드 #${GITHUB_RUN_NUMBER}" --notes-file build/BUILD-INFO.txt --draft
          gh release edit "$tag" --draft=false --latest
